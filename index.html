<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071a2b"><title>Cardápio</title>
<style>
:root{--bg:#071a2b;--card:#0d2740;--line:#1b3d5c;--tx:#eef4f8;--mut:#9db4c6;--ac:#f0c27a}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Georgia,'Times New Roman',serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
header b{font-size:18px;letter-spacing:.04em}
select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
.hero{min-height:240px;background:var(--card) center/cover;display:flex;align-items:flex-end}
.hero div{width:100%;padding:60px 16px 18px;background:linear-gradient(transparent,var(--bg))}
h1{margin:0;font-size:clamp(34px,8vw,56px);font-weight:400;font-style:italic}
.sub{color:var(--mut);margin:4px 0 12px}
.links a{display:inline-block;margin:0 8px 8px 0;padding:6px 12px;border:1px solid var(--line);border-radius:20px;color:var(--tx);text-decoration:none;font:14px system-ui}
main{max-width:760px;margin:0 auto;padding:0 16px 60px}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 0;position:sticky;top:49px;background:var(--bg);z-index:4}
nav a{white-space:nowrap;padding:7px 14px;border-radius:20px;background:var(--card);color:var(--tx);text-decoration:none;font:14px system-ui}
h2{font-size:24px;font-weight:400;margin:28px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.feat{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.feat .p{min-width:230px;flex-direction:column}
.p{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
.p img{width:92px;height:92px;object-fit:cover;border-radius:8px;flex:none}
.feat img{width:100%;height:130px}
.p h3{margin:0;font-size:18px;font-weight:700}
.p p{margin:2px 0;color:var(--mut);font-size:14px}
.pr{color:var(--ac);font-weight:700;font-family:system-ui}
.o{font:13px system-ui;color:var(--mut);display:flex;justify-content:space-between;border-top:1px dashed var(--line);margin-top:4px;padding-top:4px}
.msg{padding:60px 16px;text-align:center;color:var(--mut)}
</style></head><body>
<header><b id="bn">…</b><select id="lg"><option value="pt">🇧🇷 PT-BR</option><option value="en">🇺🇸 English</option><option value="es">🇪🇸 Español</option></select></header>
<div id="app"><div class="msg">…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const T={pt:{t:'Cardápio',s:'a bordo',f:'Destaques',n:'Cardápio não encontrado.'},en:{t:'Menu',s:'on board',f:'Highlights',n:'Menu not found.'},es:{t:'Menú',s:'a bordo',f:'Destacados',n:'Menú no encontrado.'}};
let lang='pt',D=null;
try{lang=localStorage.getItem('lang')||'pt'}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tr=(o,f)=>(lang==='pt'?o[f]:(o.translations?.[lang]?.[f]||o[f]))||'';
const money=v=>v==null?'':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let slug=location.pathname.split('/').filter(Boolean)[0]||'';
if(!slug||slug.endsWith('.html'))slug=new URLSearchParams(location.search).get('b')||'';
if(!slug||slug.endsWith('.html'))slug='foz'; // o link antigo (QR code) abre o Kattamaram II
async function load(){
  const {data:boat}=await sb.from('boats').select('*').eq('slug',slug).maybeSingle();
  if(!boat){D=null;return render()}
  const [c,p]=await Promise.all([
    sb.from('categories').select('*').eq('boat_id',boat.id).eq('active',true).order('position'),
    sb.from('products').select('*').eq('boat_id',boat.id).eq('active',true).order('position')]);
  D={boat,cats:c.data||[],prods:p.data||[]};render();
}
const card=p=>`<div class="p">${p.image_url?`<img src="${esc(p.image_url)}" alt="" loading="lazy">`:''}<div style="flex:1"><h3>${esc(tr(p,'name'))}</h3>${p.description?`<p>${esc(tr(p,'description'))}</p>`:''}${p.price!=null?`<div class="pr">${money(p.price)}</div>`:''}${(Array.isArray(p.options)?p.options:[]).map(o=>`<div class="o"><span>${esc(tr(o,'name'))}</span><span>${o.price>0?'+ '+money(o.price):''}</span></div>`).join('')}</div></div>`;
function render(){
  const t=T[lang];document.documentElement.lang=lang==='pt'?'pt-BR':lang;$('#lg').value=lang;
  if(!D){$('#app').innerHTML=`<div class="msg">${t.n}</div>`;return}
  const {boat,cats,prods}=D,fe=prods.filter(p=>p.featured);
  document.title=boat.name+' — '+t.t;$('#bn').textContent=boat.name.split('•')[0].trim().toUpperCase();
  const links=[boat.instagram&&`<a href="https://instagram.com/${esc(boat.instagram)}">Instagram</a>`,boat.whatsapp&&`<a href="https://wa.me/${esc(boat.whatsapp)}">WhatsApp</a>`].filter(Boolean).join('');
  const used=cats.filter(c=>prods.some(p=>p.category_id===c.id));
  $('#app').innerHTML=`<div class="hero" style="${boat.cover_url?`background-image:url('${esc(boat.cover_url)}')`:''}"><div><main><h1>${t.t} <em>${t.s}</em></h1><p class="sub">${esc(boat.name)}</p><div class="links">${links}</div></main></div></div>
  <main><nav>${used.map(c=>`<a href="#c${c.id}">${esc(c.icon||'')} ${esc(tr(c,'name'))}</a>`).join('')}</nav>
  ${fe.length?`<h2>${t.f}</h2><div class="feat">${fe.map(card).join('')}</div>`:''}
  ${used.map(c=>`<h2 id="c${c.id}">${esc(c.icon||'')} ${esc(tr(c,'name'))}</h2>${prods.filter(p=>p.category_id===c.id).map(card).join('')}`).join('')}</main>`;
}
function $(s){return document.querySelector(s)}
$('#lg').onchange=e=>{lang=e.target.value;try{localStorage.setItem('lang',lang)}catch(x){}render()};
load();
</script></body></html>
